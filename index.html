<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiyin Adeyera - Product Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #0D9488;
    --teal-light: #CCFBF1;
    --teal-dark: #0F766E;
    --teal-muted: #F0FDFA;
    --black: #0A0A0A;
    --gray-900: #111827;
    --gray-700: #374151;
    --gray-500: #6B7280;
    --gray-300: #D1D5DB;
    --gray-100: #F3F4F6;
    --white: #FFFFFF;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
    --max: 1100px;
    --radius: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    color: var(--gray-900);
    background: var(--white);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gray-100);
    padding: 0 2rem;
  }
  .nav-inner {
    max-width: var(--max);
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 64px;
  }
  .nav-logo {
    font-family: var(--serif);
    font-size: 1.25rem;
    color: var(--black);
    text-decoration: none;
    letter-spacing: -0.01em;
  }
  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }
  .nav-links a {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--gray-500);
    text-decoration: none;
    transition: color 0.2s;
    letter-spacing: 0.01em;
  }
  .nav-links a:hover { color: var(--teal); }

  /* ── HERO ── */
  .hero {
    padding: 140px 2rem 100px;
    max-width: var(--max);
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 80px;
    align-items: center;
  }
  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 1.25rem;
  }
  .hero-eyebrow::before {
    content: '';
    display: block;
    width: 24px; height: 2px;
    background: var(--teal);
    border-radius: 2px;
  }
  .hero h1 {
    font-family: var(--serif);
    font-size: clamp(2.5rem, 5vw, 3.75rem);
    line-height: 1.12;
    letter-spacing: -0.02em;
    color: var(--black);
    margin-bottom: 1.5rem;
  }
  .hero h1 em {
    font-style: italic;
    color: var(--teal);
  }
  .hero-bio {
    font-size: 1.1rem;
    color: var(--gray-700);
    line-height: 1.75;
    max-width: 520px;
    margin-bottom: 2rem;
  }
  .hero-actions {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .btn-primary {
    background: var(--teal);
    color: white;
    padding: 0.75rem 1.75rem;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.925rem;
    transition: background 0.2s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary:hover { background: var(--teal-dark); transform: translateY(-1px); }
  .btn-secondary {
    background: transparent;
    color: var(--gray-700);
    padding: 0.75rem 1.75rem;
    border-radius: 6px;
    border: 1.5px solid var(--gray-300);
    text-decoration: none;
    font-weight: 500;
    font-size: 0.925rem;
    transition: border-color 0.2s, color 0.2s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-secondary:hover { border-color: var(--teal); color: var(--teal); transform: translateY(-1px); }

  .hero-photo-wrap {
    position: relative;
    display: flex;
    justify-content: center;
  }
  .hero-photo-bg {
    position: absolute;
    inset: -20px -20px 20px -20px;
    background: var(--teal-muted);
    border-radius: 200px 200px 180px 180px;
    z-index: 0;
  }
  .hero-photo {
    position: relative;
    z-index: 1;
    width: 320px;
    height: 380px;
    object-fit: cover;
    object-position: center top;
    border-radius: 180px 180px 140px 140px;
    box-shadow: 0 24px 60px rgba(13,148,136,0.15);
    filter: grayscale(8%);
    transform: scaleX(-1);
  }
  .hero-tag {
    position: absolute;
    z-index: 2;
    background: white;
    border: 1px solid var(--gray-100);
    border-radius: 10px;
    padding: 10px 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--gray-700);
    white-space: nowrap;
  }
  .hero-tag-1 { bottom: 60px; left: -20px; }
  .hero-tag-2 { top: 50px; right: -30px; }
  .hero-tag .tag-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--teal);
    margin-right: 6px;
  }

  /* ── METRICS BAR ── */
  .metrics {
    background: var(--black);
    padding: 3rem 2rem;
  }
  .metrics-inner {
    max-width: var(--max);
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2rem;
  }
  .metric {
    text-align: center;
    padding: 1rem 0;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .metric:last-child { border-right: none; }
  .metric-num {
    font-family: var(--serif);
    font-size: 2.5rem;
    color: var(--teal-light);
    line-height: 1;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }
  .metric-label {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ── SECTION SHARED ── */
  section { padding: 100px 2rem; }
  .section-inner { max-width: var(--max); margin: 0 auto; }
  .section-label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::before {
    content: '';
    display: block;
    width: 20px; height: 2px;
    background: var(--teal);
    border-radius: 2px;
  }
  .section-title {
    font-family: var(--serif);
    font-size: clamp(2rem, 4vw, 2.75rem);
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--black);
    margin-bottom: 1rem;
  }
  .section-sub {
    font-size: 1.05rem;
    color: var(--gray-500);
    max-width: 560px;
    line-height: 1.7;
    margin-bottom: 3rem;
  }

  /* ── ABOUT / STORY ── */
  .about { background: var(--gray-100); }
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: start;
    margin-top: 3rem;
  }
  .about-text p {
    color: var(--gray-700);
    line-height: 1.85;
    margin-bottom: 1.25rem;
    font-size: 1rem;
  }
  .about-text p:last-child { margin-bottom: 0; }
  .timeline {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .tl-item {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 0 1.5rem;
    position: relative;
  }
  .tl-year-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .tl-year {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--teal);
    letter-spacing: 0.04em;
    padding-top: 2px;
    line-height: 1;
    white-space: nowrap;
  }
  .tl-line {
    width: 2px;
    flex: 1;
    background: var(--teal-light);
    margin-top: 8px;
    min-height: 36px;
  }
  .tl-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--teal);
    margin-top: 4px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .tl-dot.edu {
    background: var(--gray-300);
    border: 2px solid var(--gray-500);
  }
  .tl-type {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.2rem;
  }
  .tl-type.work { color: var(--teal); }
  .tl-type.edu { color: var(--gray-500); }
  .tl-content {
    padding-bottom: 2rem;
  }
  .tl-title {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--black);
    margin-bottom: 0.2rem;
  }
  .tl-sub {
    font-size: 0.85rem;
    color: var(--gray-500);
  }

  /* ── CASE STUDIES ── */
  .case-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin-bottom: 2.5rem;
  }
  .case-card {
    background: var(--white);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .case-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 48px rgba(0,0,0,0.09);
  }
  .case-card-header {
    padding: 2rem 2rem 1.5rem;
    border-bottom: 1px solid var(--gray-100);
  }
  .case-tag {
    display: inline-block;
    background: var(--teal-muted);
    color: var(--teal-dark);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 1rem;
  }
  .case-card h3 {
    font-family: var(--serif);
    font-size: 1.4rem;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: #0A0A0A;
    margin-bottom: 0.75rem;
  }
  .case-card p {
    font-size: 0.9rem;
    color: #374151;
    line-height: 1.7;
  }
  .case-card-body {
    padding: 1.5rem 2rem 2rem;
  }
  .case-metrics {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .case-metric {
    text-align: left;
  }
  .case-metric-num {
    font-family: var(--serif);
    font-size: 1.5rem;
    color: var(--teal);
    line-height: 1;
    margin-bottom: 2px;
    letter-spacing: -0.02em;
  }
  .case-metric-label {
    font-size: 0.72rem;
    color: var(--gray-500);
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .case-link {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--teal);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
  }
  .case-link svg { transition: transform 0.2s; }
  .case-card:hover .case-link svg { transform: translateX(4px); }

  /* Behance grid */
  .behance-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
  }
  .beh-card {
    background: var(--gray-100);
    border-radius: 10px;
    padding: 1.5rem;
    text-decoration: none;
    color: inherit;
    transition: background 0.2s, transform 0.2s;
    display: block;
    border: 1px solid transparent;
  }
  .beh-card:hover {
    background: var(--teal-muted);
    border-color: var(--teal-light);
    transform: translateY(-2px);
  }
  .beh-tag {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 0.5rem;
  }
  .beh-card h4 {
    font-size: 0.925rem;
    font-weight: 600;
    color: var(--black);
    line-height: 1.4;
    margin-bottom: 0.4rem;
  }
  .beh-card p {
    font-size: 0.8rem;
    color: var(--gray-500);
    line-height: 1.5;
  }

  /* ── EXPERIENCE ── */
  .experience { background: var(--gray-100); }
  .exp-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .exp-item {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 3rem;
    padding: 2.5rem 0;
    border-top: 1px solid var(--gray-300);
  }
  .exp-item:last-child { border-bottom: 1px solid var(--gray-300); }
  .exp-meta {}
  .exp-company {
    font-weight: 600;
    font-size: 1rem;
    color: var(--black);
    margin-bottom: 0.25rem;
  }
  .exp-location {
    font-size: 0.8rem;
    color: var(--gray-500);
    margin-bottom: 0.5rem;
  }
  .exp-period {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--teal);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .exp-content {}
  .exp-role {
    font-family: var(--serif);
    font-size: 1.2rem;
    color: var(--black);
    margin-bottom: 0.75rem;
    letter-spacing: -0.01em;
  }
  .exp-bullets {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .exp-bullets li {
    font-size: 0.9rem;
    color: var(--gray-700);
    line-height: 1.65;
    padding-left: 1.25rem;
    position: relative;
  }
  .exp-bullets li::before {
    content: '-';
    position: absolute;
    left: 0;
    color: var(--teal);
    font-weight: 600;
  }

  /* ── SKILLS ── */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    margin-top: 3rem;
  }
  .skill-card {
    background: var(--white);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius);
    padding: 1.75rem;
  }
  .skill-card-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--teal-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1rem;
  }
  .skill-card-icon svg { color: var(--teal); }
  .skill-card h4 {
    font-weight: 600;
    font-size: 0.925rem;
    color: var(--black);
    margin-bottom: 1rem;
  }
  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .skill-tag {
    background: var(--gray-100);
    color: var(--gray-700);
    font-size: 0.75rem;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 4px;
  }

  /* ── EDUCATION ── */
  .edu { background: var(--gray-100); }
  .edu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1.5rem;
    margin-top: 3rem;
  }
  .edu-card {
    background: var(--white);
    border: 1px solid var(--gray-100);
    border-radius: var(--radius);
    padding: 1.75rem;
  }
  .edu-degree {
    font-family: var(--serif);
    font-size: 1.1rem;
    color: var(--black);
    line-height: 1.3;
    margin-bottom: 0.5rem;
  }
  .edu-school {
    font-weight: 600;
    font-size: 0.875rem;
    color: var(--teal);
    margin-bottom: 0.25rem;
  }
  .edu-year {
    font-size: 0.8rem;
    color: var(--gray-500);
    margin-bottom: 0.75rem;
  }
  .edu-note {
    font-size: 0.82rem;
    color: var(--gray-500);
    line-height: 1.6;
    border-top: 1px solid var(--gray-100);
    padding-top: 0.75rem;
  }

  /* ── CONTACT ── */
  .contact {
    background: var(--black);
    text-align: center;
  }
  .contact .section-label { justify-content: center; color: var(--teal-light); }
  .contact .section-label::before { background: var(--teal-light); }
  .contact .section-title { color: var(--white); }
  .contact .section-sub { color: rgba(255,255,255,0.5); margin: 0 auto 2.5rem; }
  .contact-links {
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .contact-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 0.875rem 2rem;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 500;
    font-size: 0.925rem;
    transition: all 0.2s;
  }
  .contact-link-email {
    background: var(--teal);
    color: white;
  }
  .contact-link-email:hover { background: var(--teal-dark); transform: translateY(-2px); }
  .contact-link-linkedin {
    background: rgba(255,255,255,0.08);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .contact-link-linkedin:hover { background: rgba(255,255,255,0.14); transform: translateY(-2px); }
  .contact-link-behance {
    background: rgba(255,255,255,0.08);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .contact-link-behance:hover { background: rgba(255,255,255,0.14); transform: translateY(-2px); }

  /* ── FOOTER ── */
  footer {
    background: var(--black);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 2rem;
    text-align: center;
  }
  footer p {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.25);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; gap: 3rem; padding-top: 100px; }
    .hero-photo-wrap { order: -1; }
    .hero-photo { width: 240px; height: 280px; }
    .metrics-inner { grid-template-columns: repeat(2,1fr); }
    .metric { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .metric:nth-child(2n) { border-bottom: none; }
    .about-grid { grid-template-columns: 1fr; gap: 3rem; }
    .case-grid { grid-template-columns: 1fr; }
    .behance-grid { grid-template-columns: 1fr 1fr; }
    .exp-item { grid-template-columns: 1fr; gap: 0.75rem; }
    .skills-grid { grid-template-columns: 1fr 1fr; }
    .edu-grid { grid-template-columns: 1fr; }
    .nav-links { display: none; }
  }
  @media (max-width: 580px) {
    .behance-grid { grid-template-columns: 1fr; }
    .skills-grid { grid-template-columns: 1fr; }
    .metrics-inner { grid-template-columns: 1fr 1fr; }
    .hero-tag-1, .hero-tag-2 { display: none; }
  }

  /* ── FADE IN ANIMATION ── */
  .fade-in {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .fade-in.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── iOS TOGGLE SWITCH ── */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    width: 56px;
    height: 32px;
    background: #ccc;
    border: none;
    border-radius: 16px;
    padding: 2px;
    cursor: pointer;
    transition: background 0.3s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
  }

  .theme-toggle.active {
    background: var(--teal);
  }

  .theme-toggle span {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: white;
    border-radius: 14px;
    transition: transform 0.3s ease;
    font-size: 1rem;
  }

  .theme-toggle.active span {
    transform: translateX(24px);
  }

  .dark-mode .theme-toggle.active {
    background: var(--teal);
  }

  /* ── DARK MODE ── */
  :root.dark-mode {
    --black: #FFFFFF;
    --gray-900: #F3F4F6;
    --gray-700: #E5E7EB;
    --gray-500: #9CA3AF;
    --gray-300: #4B5563;
    --gray-100: #1F2937;
    --white: #0A0A0A;
  }

  .dark-mode {
    background: #0A0A0A;
    color: #F3F4F6;
  }

  .dark-mode .metrics,
  .dark-mode .contact,
  .dark-mode footer {
    background: #111827;
  }

  .dark-mode .about,
  .dark-mode .experience {
    background: #1F2937;
  }

  .dark-mode .case-card,
  .dark-mode .edu-card {
    background: #111827;
    border-color: #4B5563;
  }

  .dark-mode .case-card h3 {
    color: #E5E7EB;
  }

  .dark-mode .case-card p {
